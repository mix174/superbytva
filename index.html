/* ---------- helpers ---------- */

function weekStart(d = new Date()) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
const fmt = (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
const dayKey = (ts) => new Date(ts).toDateString();
const has = (e, w) => (e.title || "").toLowerCase().includes(w);

function relTime(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} ч назад`;
  return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}

const sum = (list, pid) =>
  list.filter((e) => e.playerId === pid).reduce((s, e) => s + e.points, 0);

function weekBuckets(log) {
  const b = {};
  log.forEach((e) => {
    const w = weekStart(new Date(e.ts)).getTime();
    (b[w] = b[w] || []).push(e);
  });
  return b;
}

function trophies(log, players) {
  const cur = weekStart().getTime();
  const out = {};
  players.forEach((p) => (out[p.id] = 0));
  Object.entries(weekBuckets(log)).forEach(([w, list]) => {
    if (Number(w) >= cur) return;
    const scores = players.map((p) => [p.id, sum(list, p.id)]);
    const best = Math.max(...scores.map((s) => s[1]));
    const win = scores.filter((s) => s[1] === best);
    if (best > 0 && win.length === 1) out[win[0][0]] += 1;
  });
  return out;
}

function streak(log, pid) {
  const days = new Set(log.filter((e) => e.playerId === pid).map((e) => dayKey(e.ts)));
  if (!days.size) return 0;
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(d.toDateString())) {
    n += 1;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

      if (!other) return false;
      const res = ws.map((w) => {
        const list = buckets[w];
        const me = sum(list, ctx.pid);
        const them = sum(list, other.id);

function earned(log, pid, players, cups) {
  const mine = log.filter((e) => e.playerId === pid);
  const ctx = { log, pid, players, cups, maxStreak: 0 };
  const days = [...new Set(mine.map((e) => dayKey(e.ts)))]
    .map((d) => new Date(d).setHours(12, 0, 0, 0))
    .sort((a, b) => a - b);
  let run = days.length ? 1 : 0;
  let best = run;
  days.forEach((d, i) => {
    if (i === 0) return;
    run = d - days[i - 1] <= 1.5 * 864e5 ? run + 1 : 1;
    best = Math.max(best, run);
  });
  ctx.maxStreak = best;
  return ACHS.filter((a) => {
    try {
      return a.test(mine, ctx);
    } catch {
      return false;
    }
  }).map((a) => a.id);
}

/* ---------- storage (JSONBin + localStorage cache) ---------- */

const BIN_URL = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`;
const HEADERS = { "Content-Type": "application/json", "X-Access-Key": CONFIG.ACCESS_KEY };

function readCache() {
  try {
    const v = localStorage.getItem(KEY);
    return v ? JSON.parse(v) : null;
  } catch {
    return null;
  }
}
function writeCache(v) {
  try {
    localStorage.setItem(KEY, JSON.stringify(v));
  } catch {}
}

async function loadRaw() {
  try {
    const res = await fetch(`${BIN_URL}/latest`, {
      headers: { ...HEADERS, "X-Bin-Meta": "false" },
      cache: "no-store",
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!data || !Object.keys(data).length) return readCache();
    writeCache(data);
    return data;
  } catch {
    return readCache();
  }
}

async function saveMerged(local) {
  const remote = await loadRaw();
  let merged = local;
  if (remote) {
    const seen = new Set();
    const dropped = new Set([...(remote.removed || []), ...(local.removed || [])]);
    const log = [...(remote.log || []), ...(local.log || [])]
      .filter((e) => (seen.has(e.id) ? false : seen.add(e.id)))
      .filter((e) => !dropped.has(e.id));
    const newer = (remote.settingsAt || 0) > (local.settingsAt || 0) ? remote : local;
    merged = { ...newer, log, removed: [...dropped].slice(-300) };
  }
  writeCache(merged);
  try {
    await fetch(BIN_URL, {
      method: "PUT",
      headers: HEADERS,
      body: JSON.stringify(merged),
    });
  } catch {
    /* оставляем локальную версию до следующего сохранения */
  }
  return merged;
}

/* ---------- app ---------- */

function App() {
  const [state, setState] = useState(INITIAL);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("chores");
  const [open, setOpen] = useState(null);
  const [pop, setPop] = useState(null);
  const [toast, setToast] = useState("");
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    (async () => {
      const r = await loadRaw();
      if (r) setState({ ...INITIAL, ...r });
      setReady(true);
    })();
  }, []);

  const sync = useCallback(async (next) => {
    setState(next);
    const merged = await saveMerged(next);
    setState((cur) => (cur === next ? merged : cur));
  }, []);

  useEffect(() => {
    const pull = async () => {
      if (document.hidden) return;
      const r = await loadRaw();
      if (r) setState((cur) => ({ ...cur, ...r }));
    };
    const t = setInterval(pull, CONFIG.POLL_MS);
    document.addEventListener("visibilitychange", pull);
    return () => {
      clearInterval(t);
      document.removeEventListener("visibilitychange", pull);
    };
  }, []);

  const ws = weekStart();
  const log = state.log || [];
  const weekLog = log.filter((e) => e.ts >= ws.getTime());
  const [A, B] = state.players;
  const sa = sum(weekLog, A.id);
  const sb = sum(weekLog, B.id);
  const total = sa + sb;
  const cups = trophies(log, state.players);

  const prevStart = new Date(ws);
  prevStart.setDate(prevStart.getDate() - 7);
  const prevLog = log.filter((e) => e.ts >= prevStart.getTime() && e.ts < ws.getTime());

  const addEntry = useCallback(
    (chore, playerId, extra = {}) => {
      const s = stateRef.current;
      const entry = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        choreId: chore.id || "custom",
        icon: chore.icon || "✳️",
        title: chore.title,
        points: chore.points,
        playerId,
        ts: Date.now(),
        ...extra,
      };
      const nextLog = [...s.log, entry];
      const next = { ...s, log: nextLog };
      sync(next);
      setOpen(null);

      const p = s.players.find((x) => x.id === playerId);
      const cupsNow = trophies(nextLog, s.players)[playerId];
      const before = earned(s.log, playerId, s.players, cupsNow);
      const after = earned(nextLog, playerId, s.players, cupsNow);
      const fresh = after.find((id) => !before.includes(id));
      const wsNow = weekStart().getTime();
      const wk = sum(s.log.filter((e) => e.ts >= wsNow), playerId);
      const jumped = titleFor(wk + chore.points) !== titleFor(wk);
      const st = streak(nextLog, playerId);

      setPop({ playerId, points: chore.points, k: entry.id });
      if (fresh) {
        const a = ACHS.find((x) => x.id === fresh);
        setToast(`${a.icon} ${p.name} получает: ${a.name}`);
      } else if (jumped) {
        setToast(`${p.name} теперь ${titleFor(wk + chore.points).toLowerCase()}`);
      } else if (st >= 3) {
        setToast(`${st}-й день подряд, ${p.name}`);
      } else setToast("");
      setTimeout(() => setPop((x) => (x && x.k === entry.id ? null : x)), 1100);
      setTimeout(() => setToast(""), 3200);
    },
    [sync]
  );

  function removeEntry(id) {
    const s = stateRef.current;
    sync({ ...s, log: s.log.filter((e) => e.id !== id), removed: [...(s.removed || []), id] });
  }

  if (!ready)
    return (
      <div style={{ ...S.root, display: "grid", placeItems: "center" }}>
        <span style={{ color: C.dim }}>Загружаем счёт…</span>
      </div>
    );

  return (
    <div style={S.root}>
      <style>{`
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        button:focus-visible { outline: 2px solid ${C.text}; outline-offset: 2px; }
        input:focus, textarea:focus { outline: none; border-color: ${C.dim}; }
        @keyframes rise { 0%{opacity:0;transform:translateY(8px) scale(.85)} 25%{opacity:1;transform:translateY(-4px) scale(1.05)} 100%{opacity:0;transform:translateY(-30px) scale(1)} }
        @keyframes slide { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
        .pop { animation: rise 1.1s ease-out forwards; }
        .toast { animation: slide .25s ease-out; }
        @media (prefers-reduced-motion: reduce) { .pop{animation:none;opacity:0} .toast{animation:none} }
      `}</style>

      <header style={S.head}>
        <span style={S.week}>
          Неделя {fmt(ws)} — {fmt(new Date(ws.getTime() + 6 * 864e5))}
        </span>
      </header>

      <section style={S.board}>
        <Side p={A} score={sa} cups={cups[A.id]} st={streak(log, A.id)} pop={pop} align="left" />
        <div style={S.vs}>:</div>
        <Side p={B} score={sb} cups={cups[B.id]} st={streak(log, B.id)} pop={pop} align="right" />
      </section>

      <div style={S.barWrap}>
        <div style={{ ...S.bar, width: total ? `${(sa / total) * 100}%` : "50%", background: A.color }} />
        <div style={{ ...S.bar, flex: 1, background: total ? B.color : C.line }} />
      </div>

      {toast ? (
        <p className="toast" style={S.toast}>{toast}</p>
      ) : (
        <p style={S.prize}>
          {total === 0
            ? "Счёт 0:0. Кто-то же должен начать."
            : sa === sb
            ? "Ничья. Подозрительно ровно."
            : `Ведёт ${sa > sb ? A.name : B.name} — ${titleFor(Math.max(sa, sb)).toLowerCase()}, разрыв ${Math.abs(sa - sb)}.`}
          {state.prize ? ` Приз: ${state.prize.toLowerCase()}.` : ""}
        </p>
      )}

      <nav style={S.tabs}>
        {[
          ["chores", "Дела"],
          ["duel", "Дуэль"],
          ["feed", "Лента"],
          ["ach", "Награды"],
          ["set", "⚙"],
        ].map(([k, label]) => (
          <button
            key={k}
            onClick={() => setTab(k)}
            style={{
              ...S.tab,
              color: tab === k ? C.text : C.dim,
              borderBottomColor: tab === k ? C.text : "transparent",
            }}
          >
            {label}
          </button>
        ))}
      </nav>

      <main style={S.main}>
        {tab === "chores" && (
          <>
            <ul style={S.list}>
              {state.chores.map((c) => (
                <li key={c.id} style={S.row}>
                  <button
                    onClick={() => setOpen(open === c.id ? null : c.id)}
                    style={S.choreBtn}
                    aria-expanded={open === c.id}
                  >
                    <span style={S.icon}>{c.icon || "✳️"}</span>
                    <span style={{ flex: 1 }}>{c.title}</span>
                    <span style={S.pts}>{c.points}</span>
                  </button>
                  {open === c.id && (
                    <div style={S.who}>
                      {state.players.map((p) => (
                        <button
                          key={p.id}
                          onClick={() => addEntry(c, p.id)}
                          style={{ ...S.whoBtn, background: p.color }}
                        >
                          {p.name}
                        </button>
                      ))}
                    </div>
                  )}
                </li>
              ))}
            </ul>
            <QuickAdd state={state} sync={sync} addEntry={addEntry} />
          </>
        )}

        {tab === "duel" && <Duel state={state} addEntry={addEntry} />}

        {tab === "feed" && (
          <div>
            {prevLog.length > 0 && (
              <p style={S.note}>
                Прошлая неделя: {sum(prevLog, A.id)} — {sum(prevLog, B.id)}
              </p>
            )}
            {weekLog.length === 0 ? (
              <p style={S.empty}>
                На этой неделе пусто. Посуда сама себя не помоет — откройте «Дела».
              </p>
            ) : (
              <ul style={S.list}>
                {[...weekLog]
                  .sort((a, b) => b.ts - a.ts)
                  .map((e) => {
                    const p = state.players.find((x) => x.id === e.playerId);
                    return (
                      <li key={e.id} style={S.feedRow}>
                        <span style={S.icon}>{e.icon || "✳️"}</span>
                        <span style={{ flex: 1 }}>
                          {e.title} {e.duel && "⚔️"}
                          <span style={S.feedMeta}>
                            <span style={{ ...S.dot, background: p ? p.color : C.dim }} />
                            {p ? p.name : "?"}, {relTime(e.ts)}
                            {e.duel && " · проиграл дуэль"}
                          </span>
                        </span>
                        <span style={S.pts}>+{e.points}</span>
                        <button onClick={() => removeEntry(e.id)} style={S.undo} aria-label="Убрать запись">
                          ✕
                        </button>
                      </li>
                    );
                  })}
              </ul>
            )}
          </div>
        )}

        {tab === "ach" && (
          <ul style={S.list}>
            {ACHS.map((a) => {
              const owners = state.players.filter((p) =>
                earned(log, p.id, state.players, cups[p.id]).includes(a.id)
              );
              const got = owners.length > 0;
              return (
                <li key={a.id} style={{ ...S.achRow, opacity: got ? 1 : 0.45 }}>
                  <span style={{ ...S.icon, filter: got ? "none" : "grayscale(1)" }}>{a.icon}</span>
                  <span style={{ flex: 1 }}>
                    {a.name}
                    <span style={S.feedMeta}>{a.desc}</span>
                  </span>
                  <span style={{ display: "flex", gap: 4 }}>
                    {owners.map((p) => (
                      <span key={p.id} style={{ ...S.dot, background: p.color, marginRight: 0 }} />
                    ))}
                  </span>
                </li>
              );
            })}
          </ul>
        )}

        {tab === "set" && <Settings state={state} sync={sync} />}
      </main>
    </div>
  );
}

function Side({ p, score, cups, st, pop, align }) {
  return (
    <div style={{ textAlign: align, position: "relative", flex: 1 }}>
      {pop && pop.playerId === p.id && (
        <span className="pop" style={{ ...S.popup, color: p.color }}>+{pop.points}</span>
      )}
      <div style={{ ...S.score, color: p.color }}>{score}</div>
      <div style={S.name}>{p.name}</div>
      <div style={S.meta}>
        {cups > 0 && <span>🏆 {cups}</span>}
        {st > 1 && <span>🔥 {st} дн</span>}
        {cups === 0 && st < 2 && <span>{titleFor(score).toLowerCase()}</span>}
      </div>
    </div>
  );
}

/* ---------- duel ---------- */

const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function Duel({ state, addEntry }) {
  const [chore, setChore] = useState(null);
  const [mode, setMode] = useState(null);
  const [cells, setCells] = useState(Array(9).fill(null));
  const [turn, setTurn] = useState(0);
  const [loser, setLoser] = useState(null);
  const [spin, setSpin] = useState(null);
  const timer = useRef(null);

  useEffect(() => () => clearInterval(timer.current), []);

  function reset() {
    clearInterval(timer.current);
    setCells(Array(9).fill(null));
    setTurn(0);
    setLoser(null);
    setSpin(null);
  }

  function play(i) {
    if (cells[i] !== null || loser) return;
    const next = [...cells];
    next[i] = turn;
    setCells(next);
    const line = LINES.find((l) => l.every((k) => next[k] === turn));
    if (line) setLoser(state.players[1 - turn].id);
    else if (next.every((c) => c !== null)) setLoser("draw");
    else setTurn(1 - turn);
  }

  function drawLot() {
    let n = 0;
    setSpin(0);
    clearInterval(timer.current);
    timer.current = setInterval(() => {
      n += 1;
      setSpin(n % 2);
      if (n > 13) {
        clearInterval(timer.current);
        const pick = Math.random() < 0.5 ? 0 : 1;
        setSpin(pick);
        setLoser(state.players[pick].id);
      }
    }, 110);
  }

  if (!chore)
    return (
      <div>
        <p style={S.hint}>
          Выберите дело, которое никто не хочет делать. Проигравший получает его
          с двойными очками — так проиграть не обидно.
        </p>
        <ul style={S.list}>
          {state.chores.map((c) => (
            <li key={c.id} style={S.row}>
              <button onClick={() => { setChore(c); reset(); }} style={S.choreBtn}>
                <span style={S.icon}>{c.icon || "✳️"}</span>
                <span style={{ flex: 1 }}>{c.title}</span>
                <span style={S.pts}>{c.points * 2}</span>
              </button>
            </li>
          ))}
        </ul>
      </div>
    );

  const loserP = state.players.find((p) => p.id === loser);

  return (
    <div>
      <button onClick={() => { setChore(null); setMode(null); reset(); }} style={S.back}>
        ← {chore.icon} {chore.title} · {chore.points * 2} очков
      </button>

      {!mode && (
        <div style={{ display: "grid", gap: 8, marginTop: 12 }}>
          <button onClick={() => setMode("ttt")} style={S.add}>Крестики-нолики</button>
          <button onClick={() => { setMode("lot"); drawLot(); }} style={S.add}>Жребий</button>
          <p style={S.hint}>
            Крестики-нолики — игра навыка: если один играет заметно лучше,
            берите жребий, иначе дело всегда будет доставаться одному и тому же.
          </p>
        </div>
      )}

      {mode === "ttt" && (
        <div style={{ marginTop: 14 }}>
          <p style={S.turnLine}>
            {loser
              ? loser === "draw"
                ? "Ничья. Ещё раз."
                : `Проиграл ${loserP.name}`
              : `Ходит ${state.players[turn].name}`}
          </p>
          <div style={S.grid}>
            {cells.map((c, i) => (
              <button
                key={i}
                onClick={() => play(i)}
                style={{ ...S.cell, color: c === null ? C.line : state.players[c].color }}
                aria-label={`Клетка ${i + 1}`}
              >
                {c === null ? "" : c === 0 ? "✕" : "○"}
              </button>
            ))}
          </div>
        </div>
      )}

      {mode === "lot" && (
        <div style={{ marginTop: 14, textAlign: "center" }}>
          <div
            style={{
              ...S.score,
              fontSize: 34,
              color: spin === null ? C.dim : state.players[spin].color,
              padding: "26px 0",
            }}
          >
            {spin === null ? "…" : state.players[spin].name}
          </div>
        </div>
      )}

      {loser && loser !== "draw" && (
        <div style={{ display: "grid", gap: 8, marginTop: 14 }}>
          <button
            onClick={() => { addEntry({ ...chore, points: chore.points * 2 }, loser, { duel: true }); setChore(null); setMode(null); reset(); }}
            style={{ ...S.whoBtn, background: loserP.color, padding: "15px 0" }}
          >
            Записать на {loserP.name} · +{chore.points * 2}
          </button>
          <button onClick={reset} style={S.cancelWide}>Переиграть</button>
        </div>
      )}

      {loser === "draw" && (
        <button onClick={reset} style={{ ...S.cancelWide, marginTop: 14 }}>Ещё раз</button>
      )}
    </div>
  );
}

/* ---------- quick add ---------- */

function QuickAdd({ state, sync, addEntry }) {
  const [on, setOn] = useState(false);
  const [title, setTitle] = useState("");
  const [icon, setIcon] = useState("✳️");
  const [points, setPoints] = useState(2);
  const [keep, setKeep] = useState(false);

  function log(playerId) {
    const t = title.trim();
    if (!t) return;
    const chore = { id: `x${Date.now()}`, icon, title: t, points: Number(points) || 1 };
    if (keep) sync({ ...state, chores: [...state.chores, chore], settingsAt: Date.now() });
    addEntry(chore, playerId);
    setTitle(""); setIcon("✳️"); setPoints(2); setKeep(false); setOn(false);
  }

  if (!on)
    return <button onClick={() => setOn(true)} style={S.quick}>+ Разовое дело</button>;

  return (
    <div style={S.quickBox}>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={icon} onChange={(e) => setIcon(e.target.value.slice(0, 2))}
          style={{ ...S.input, width: 52, textAlign: "center", marginBottom: 0 }} aria-label="Иконка" />
        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Что сделали" autoFocus
          style={{ ...S.input, flex: 1, marginBottom: 0 }} />
        <input type="number" min="1" max="9" value={points} onChange={(e) => setPoints(e.target.value)}
          style={{ ...S.input, width: 56, marginBottom: 0 }} aria-label="Очки" />
      </div>
      <label style={S.check}>
        <input type="checkbox" checked={keep} onChange={(e) => setKeep(e.target.checked)} />
        Оставить в списке дел
      </label>
      <div style={S.who}>
        {state.players.map((p) => (
          <button key={p.id} onClick={() => log(p.id)} disabled={!title.trim()}
            style={{ ...S.whoBtn, background: p.color, opacity: title.trim() ? 1 : 0.4 }}>
            {p.name}
          </button>
        ))}
        <button onClick={() => setOn(false)} style={S.cancel}>Отмена</button>
      </div>
    </div>
  );
}

/* ---------- settings ---------- */

function Settings({ state, sync }) {
  const [dump, setDump] = useState("");
  const [paste, setPaste] = useState("");
  const [msg, setMsg] = useState("");
  const [armed, setArmed] = useState(false);
  const upd = (patch) => sync({ ...state, ...patch, settingsAt: Date.now() });
  const setChore = (i, patch) =>
    upd({ chores: state.chores.map((x, j) => (j === i ? { ...x, ...patch } : x)) });

  function restore() {
    const t = paste.trim();
    if (!t) return setMsg("Вставьте текст резервной копии в поле выше.");
    try {
      const d = JSON.parse(t);
      if (!d.players || !d.log) throw new Error();
      sync({ ...INITIAL, ...d, settingsAt: Date.now() });
      setPaste("");
      setMsg("Восстановлено.");
    } catch {
      setMsg("Не похоже на резервную копию. Проверьте, что скопирован весь текст.");
    }
  }

  return (
    <div style={{ display: "grid", gap: 22 }}>
      <div>
        <h3 style={S.h3}>Кто играет</h3>
        {state.players.map((p, i) => (
          <input key={p.id} value={p.name}
            onChange={(e) => upd({ players: state.players.map((x, j) => (j === i ? { ...x, name: e.target.value } : x)) })}
            style={{ ...S.input, borderColor: p.color }} />
        ))}
      </div>

      <div>
        <h3 style={S.h3}>Приз победителю недели</h3>
        <input value={state.prize} onChange={(e) => upd({ prize: e.target.value })} style={S.input} />
      </div>

      <div>
        <h3 style={S.h3}>Дела и вес</h3>
        <p style={S.hint}>Ставьте веса вдвоём. Дело, которое бесит сильнее, стоит дороже.</p>
        {state.chores.map((c, i) => (
          <div key={c.id} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={c.icon || ""} onChange={(e) => setChore(i, { icon: e.target.value.slice(0, 2) })}
              style={{ ...S.input, width: 52, textAlign: "center", marginBottom: 0 }} aria-label="Иконка" />
            <input value={c.title} onChange={(e) => setChore(i, { title: e.target.value })}
              style={{ ...S.input, flex: 1, marginBottom: 0 }} />
            <input type="number" min="1" max="9" value={c.points}
              onChange={(e) => setChore(i, { points: Number(e.target.value) || 1 })}
              style={{ ...S.input, width: 56, marginBottom: 0 }} aria-label="Очки" />
            <button onClick={() => upd({ chores: state.chores.filter((x) => x.id !== c.id) })}
              style={S.del} aria-label="Удалить дело">✕</button>
          </div>
        ))}
        <button onClick={() => upd({ chores: [...state.chores, { id: `c${Date.now()}`, icon: "✳️", title: "Новое дело", points: 1 }] })}
          style={S.add}>Добавить дело</button>
      </div>

      <div>
        <h3 style={S.h3}>Титулы за неделю</h3>
        <p style={S.hint}>
          1 — новичок, 5 — подмастерье, 12 — боец рутины, 22 — мастер швабры,
          35 — легенда быта. 🏆 — выигранные недели, 🔥 — дни подряд.
        </p>
      </div>

      <div>
        <h3 style={S.h3}>Резервная копия</h3>
        <p style={S.hint}>
          Данные лежат в одном bin на jsonbin.io. Раз в пару недель копируйте текст
          ниже себе в заметки — если bin потеряется, вставьте копию во второе поле
          и нажмите «Восстановить».
        </p>
        <textarea readOnly value={dump} placeholder="Нажмите «Показать данные»"
          style={{ ...S.input, height: 90, fontSize: 12, resize: "vertical" }} />
        <button onClick={() => setDump(JSON.stringify(state))} style={{ ...S.add, marginBottom: 12 }}>
          Показать данные
        </button>
        <textarea value={paste} onChange={(e) => { setPaste(e.target.value); setMsg(""); }}
          placeholder="Вставьте сюда резервную копию"
          style={{ ...S.input, height: 70, fontSize: 12, resize: "vertical" }} />
        <button onClick={restore} style={S.add}>Восстановить</button>
        {msg && <p style={{ ...S.hint, margin: "10px 0 0" }}>{msg}</p>}
      </div>

      <div>
        <button
          onClick={() => {
            if (!armed) {
              setArmed(true);
              setTimeout(() => setArmed(false), 4000);
              return;
            }
            setArmed(false);
            sync({ ...INITIAL, settingsAt: Date.now() });
          }}
          style={{ ...S.reset, width: "100%" }}
        >
          {armed ? "Точно стереть? Нажмите ещё раз" : "Начать всё заново"}
        </button>
      </div>
    </div>
  );
}
